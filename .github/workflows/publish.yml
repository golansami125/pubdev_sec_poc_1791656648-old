# Publish workflow used by every repository in the PoC (legitimate and
# recreated alike). It prints the repository identity GitHub puts in the OIDC
# token, then runs `dart pub publish`, which exchanges that token with pub.dev.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Repository identity (what pub.dev will see)
        shell: bash
        run: |
          echo "slug:      $GITHUB_REPOSITORY"
          echo "repo_id:   ${{ github.repository_id }}"
          echo "owner_id:  ${{ github.repository_owner_id }}"
          echo "ref:       $GITHUB_REF   event: $GITHUB_EVENT_NAME"
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" | jq -r .value)
          echo "::add-mask::$TOKEN"
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ("sub","repository","repository_id","repository_owner","repository_owner_id","ref","event_name")}, indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          set +e
          dart pub publish --force 2>&1 | tee /tmp/publish.log
          rc=${PIPESTATUS[0]}
          echo "PUBLISH_EXIT: $rc"
          grep -i -E "Successfully uploaded|identifiers changed|not enabled|UnauthorizedAccess|Authorization|error" /tmp/publish.log | sed 's/^/PUBLISH_MSG: /' || true
          exit $rc
